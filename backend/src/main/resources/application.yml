spring:
  application:
    name: smart-campus-operations

  datasource:
    url: jdbc:mysql://localhost:3306/smart_campus_operations
    username: ${DB_USERNAME:root}
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.smart_campus_operations: DEBUG
    org.springframework.security: INFO
